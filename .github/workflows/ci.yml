name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # This repo and the core it links live side by side, like they do locally.
      - uses: actions/checkout@v4
        with:
          path: dtu_tui
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/dtu_core
          path: dtu_core
      - name: Build
        working-directory: dtu_tui
        run: cargo build --release
      - name: Clippy
        working-directory: dtu_tui
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: dtu_tui
        run: cargo test
