[package]
name = "dtu_tui"
version = "0.1.0"
edition = "2021"
description = "dtu terminal UI: status, devices, invitations and the pairing code"

[[bin]]
name = "dtu-tui"
path = "src/main.rs"

[dependencies]
dtu_core = { path = "../dtu_core" }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
ratatui = "0.29"
crossterm = "0.28"
